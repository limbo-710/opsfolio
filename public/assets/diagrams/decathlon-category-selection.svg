<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 246" role="img" aria-labelledby="title desc">
<title id="title">Decathlon Category Selection</title><desc id="desc">横向运营流程图，共 6 个步骤；节点等宽、间距一致，箭头两侧留白均匀。</desc>
<defs><filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#514637" flood-opacity=".09"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#718479"/></marker></defs>
<style>text{font-family:'HarmonyOS Sans SC','HarmonyOS Sans','Noto Sans SC','Microsoft YaHei',sans-serif}.step{font-size:12px;font-weight:700;letter-spacing:1px;fill:#a04430}.label{font-size:16px;font-weight:600;fill:#27271f}.terminal .step{fill:#f4c7b7}.terminal .label{fill:#fffaf1}</style>
<path d="M200.7 92.0H212.7" fill="none" stroke="#718479" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M397.3 92.0H409.3" fill="none" stroke="#718479" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M594.0 92.0H606.0" fill="none" stroke="#718479" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M790.7 92.0H802.7" fill="none" stroke="#718479" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M987.3 92.0H999.3" fill="none" stroke="#718479" stroke-width="2.2" marker-end="url(#arrow)"/>
<g class="terminal"><rect x="24.0" y="34" width="168.7" height="116" rx="20" fill="#365b48" stroke="#365b48" stroke-width="1.35" filter="url(#shadow)"/>
<text class="step" x="108.3" y="78.5" text-anchor="middle">STEP 01</text>
<text class="label" x="108.3" y="106.5" text-anchor="middle" fill="#fffaf1">目标圈层</text>
</g>
<g class="step"><rect x="220.7" y="34" width="168.7" height="116" rx="20" fill="#fffaf1" stroke="#d7d1c4" stroke-width="1.35" filter="url(#shadow)"/>
<text class="step" x="305.0" y="78.5" text-anchor="middle">STEP 02</text>
<text class="label" x="305.0" y="106.5" text-anchor="middle" fill="#27271f">动机与使用场景</text>
</g>
<g class="step"><rect x="417.3" y="34" width="168.7" height="116" rx="20" fill="#fffaf1" stroke="#d7d1c4" stroke-width="1.35" filter="url(#shadow)"/>
<text class="step" x="501.7" y="68.5" text-anchor="middle">STEP 03</text>
<text class="label" x="501.7" y="96.5" text-anchor="middle" fill="#27271f">核心品类筛选</text>
<text class="label" x="501.7" y="116.5" text-anchor="middle" fill="#27271f">水上 · 通勤 · 骑行</text>
</g>
<g class="step"><rect x="614.0" y="34" width="168.7" height="116" rx="20" fill="#fffaf1" stroke="#d7d1c4" stroke-width="1.35" filter="url(#shadow)"/>
<text class="step" x="698.3" y="68.5" text-anchor="middle">STEP 04</text>
<text class="label" x="698.3" y="96.5" text-anchor="middle" fill="#27271f">差异化选品</text>
<text class="label" x="698.3" y="116.5" text-anchor="middle" fill="#27271f">组货</text>
</g>
<g class="step"><rect x="810.7" y="34" width="168.7" height="116" rx="20" fill="#fffaf1" stroke="#d7d1c4" stroke-width="1.35" filter="url(#shadow)"/>
<text class="step" x="895.0" y="68.5" text-anchor="middle">STEP 05</text>
<text class="label" x="895.0" y="96.5" text-anchor="middle" fill="#27271f">文案与视觉</text>
<text class="label" x="895.0" y="116.5" text-anchor="middle" fill="#27271f">Brief</text>
</g>
<g class="terminal"><rect x="1007.3" y="34" width="168.7" height="116" rx="20" fill="#365b48" stroke="#365b48" stroke-width="1.35" filter="url(#shadow)"/>
<text class="step" x="1091.7" y="68.5" text-anchor="middle">STEP 06</text>
<text class="label" x="1091.7" y="96.5" text-anchor="middle" fill="#fffaf1">页面动线与</text>
<text class="label" x="1091.7" y="116.5" text-anchor="middle" fill="#fffaf1">货架陈列</text>
</g>
</svg>
